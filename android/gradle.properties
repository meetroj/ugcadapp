# Project-wide Gradle settings. Contains NO secrets and is committed.
# Release signing (UGCAD_UPLOAD_STORE_FILE / _STORE_PASSWORD / _KEY_ALIAS / _KEY_PASSWORD)
# lives in the owner's user-level ~/.gradle/gradle.properties, never in this repo.

org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true

android.useAndroidX=true

# AGP 9's built-in Kotlin forbids the kotlin.sourceSets DSL that older KSP-based libraries
# (async-storage's Room/KSP codegen) still use. AGP's own error names this flag as the fix.
android.disallowKotlinSourceSets=false

# Architectures to build. Override on the CLI: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

newArchEnabled=true
hermesEnabled=true

android.builtInKotlin=false
android.newDsl=false
