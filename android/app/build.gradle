apply plugin: "com.android.application"
// AGP 9.0+ ships built-in Kotlin support and registers the "kotlin" extension itself,
// which collides with an explicit apply here. Guard it so this works on both.
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: "org.jetbrains.kotlin.android"
}
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

// Firebase (push). The google-services plugin is applied ONLY when the owner has put
// android/app/google-services.json in place (it is gitignored). Without it the build still
// succeeds; FCM then has no project and push:register fails at runtime.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.ugcapp"
    defaultConfig {
        applicationId "com.ugcapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 26
        versionName "1.3.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release signing comes from the owner's ~/.gradle/gradle.properties (never from git):
        // UGCAD_UPLOAD_STORE_FILE (absolute path), UGCAD_UPLOAD_STORE_PASSWORD,
        // UGCAD_UPLOAD_KEY_ALIAS, UGCAD_UPLOAD_KEY_PASSWORD.
        release {
            if (project.hasProperty('UGCAD_UPLOAD_STORE_FILE')) {
                storeFile file(UGCAD_UPLOAD_STORE_FILE)
                storePassword UGCAD_UPLOAD_STORE_PASSWORD
                keyAlias UGCAD_UPLOAD_KEY_ALIAS
                keyPassword UGCAD_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Without the upload key the release is debug-signed: fine for local smoke tests,
            // NOT accepted by Play. The build prints a warning in that case.
            signingConfig project.hasProperty('UGCAD_UPLOAD_STORE_FILE')
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

if (!project.hasProperty('UGCAD_UPLOAD_STORE_FILE')) {
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.name.toLowerCase().contains('bundlerelease') }) {
            logger.warn("WARNING: UGCAD_UPLOAD_STORE_FILE is not set: the release bundle is signed with the DEBUG key and Play will reject it.")
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.core:core-splashscreen:1.0.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
